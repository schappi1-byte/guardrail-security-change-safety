# Usage/invocation
usage: |
  1. Provide a Terraform change diff or IAM policy change
  2. Provide a dependency configuration (services, roles, usage patterns)
  3. Guardrail analyzes and produces an impact report
  4. Use the report to make safer change decisions

  Example:
  ```python
  from guardrail.agent import GuardrailAgent
  
  agent = GuardrailAgent()
  report = agent.analyze_terraform_change(
    change_id="pr-1234",
    terraform_diff=diff_content,
    dependency_config=config
  )
  
  pr_comment = agent.format_pr_comment(report)
  ```

# Input types
input_types:
  - terraform_diff
  - iam_policy_diff
  - json_dependency_config
  - github_pr

# Output types
output_types:
  - security_change_impact_report
  - github_pr_comment
  - structured_json

# Example use case
example: |
  A security engineer opens a PR that removes s3:GetObject from a shared IAM role.
  
  Guardrail automatically:
  - Finds all services using this role
  - Checks CloudTrail and sees billing-api and invoice-worker actively use this permission
  - Identifies them as production workloads
  - Flags this as HIGH IMPACT
  - Recommends: create new role, migrate services, verify access, then remove permission
  
  Output: GitHub PR comment with evidence and step-by-step migration plan.

