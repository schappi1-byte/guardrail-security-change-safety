# One-line description (appears in search results)
tagline: Know what your security changes will break before you deploy them.

# Full description
description: |
  Guardrail is a dependency-aware security change impact agent that identifies the real-world 
  consequences of security changes before they reach production. It analyzes infrastructure 
  dependencies, permissions, and observed usage patterns to determine what a change could break, 
  provides evidence for each affected workload or service, and recommends a safer way to 
  implement the change.

  The problem it solves: Security engineers regularly deploy IAM policy and access control changes 
  without knowing what services will break. They either over-privilege (to avoid breakage) or 
  accidentally break production deployments.

  Guardrail traces dependencies from IAM roles through service accounts to workloads, correlates 
  against CloudTrail usage evidence, and produces a security change impact report with:
  - Affected services (production vs. staging)
  - Evidence of actual usage
  - Impact confidence levels
  - Step-by-step safer rollout plans

# Key features
features:
  - Evidence-based impact assessment (not guesses)
  - Production vs. staging environment awareness
  - Confidence levels for each impact claim
  - Safe rollout recommendations
  - GitHub PR integration
  - CloudTrail usage evidence
  - IAM role dependency tracing
  - Kubernetes service account support

